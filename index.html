<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Model 3</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar__container">
      <div class="navbar__logo">
        <img src="assets/logo-alternate.png" alt="Tesla">
      </div>
      <nav class="navbar__links">
        <a href="#" class="navbar__link">Vehicles</a>
        <a href="#" class="navbar__link">Energy</a>
        <a href="#" class="navbar__link">Charging</a>
        <a href="#" class="navbar__link">Discover</a>
        <a href="#" class="navbar__link">Shop</a>
      </nav>
      <div class="navbar__actions">
        <a href="#" class="btn btn--primary">Жолоодож үзэх</a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero__bg">
      <img src="assets/header-30.png" alt="">
      <div class="hero__overlay"></div>
    </div>
    <div class="hero__container">
      <div class="hero__content">
        <h1 class="hero__title">Model 3</h1>
        <p class="hero__subtitle">0.99% APR Available</p>
      </div>
      <div class="hero__actions">
        <a href="#" class="btn btn--primary">Яг одоо захиалах</a>
        <a href="#" class="btn btn--outline">Дэлгэрэнгүйг үзэх</a>
      </div>
    </div>
  </section>

  <section class="fsd">
    <div class="fsd__container">
      <div class="fsd__content">
        <div class="fsd__text-block">
          <div class="fsd__title-group">
            <h2 class="fsd__title">Full Self-Driving (Supervised)</h2>
            <p class="fsd__subtitle">Makes every drive easier. Subscribe for $99/mo.</p>
          </div>
          <div class="fsd__stats">
            <div class="fsd__stat">
              <span class="fsd__stat-number">7x</span>
              <span class="fsd__stat-label">Fewer Collisions</span>
            </div>
            <div class="fsd__stat">
              <span class="fsd__stat-number">13,599,898,816</span>
              <span class="fsd__stat-label">Miles Driven</span>
            </div>
          </div>
        </div>
        <div class="fsd__actions">
          <a href="#" class="btn btn--outline">Демо үзэх/ Цаг авах</a>
          <a href="#" class="btn btn--link">
            Дэлгэрэнгүй үзэх
            <img src="assets/chevron-vector.svg" alt="" class="btn__icon">
          </a>
        </div>
      </div>
      <div class="fsd__image">
        <img src="assets/placeholder-image.png" alt="Full Self-Driving view">
      </div>
    </div>
  </section>

</body>
</html>
